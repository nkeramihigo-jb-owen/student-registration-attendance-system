{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Student</title>

    <link rel="stylesheet" href="{% static 'students/css/style.css' %}">
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            Student System
        </div>

        <a href="/" class="admin-link">
            Home
        </a>
    </nav>


    <main class="registration-container">

        <div class="registration-card">

            <h1>Register Student</h1>

            <p class="form-description">
                Enter the student's information below to register them
                into the system.
            </p>


            <form method="POST">

            {% if error %}
                <div class="form-error">
                    {{ error }}
                </div>
            {% endif %}

            {% csrf_token %}

                <div class="form-group">
                    <label for="registration_number">
                        Registration Number
                    </label>

                    <input
                        type="text"
                        id="registration_number"
                        name="registration_number"
                        placeholder="e.g. 24/U/12345"
                        required
                    >
                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label for="first_name">
                            First Name
                        </label>

                        <input
                            type="text"
                            id="first_name"
                            name="first_name"
                            placeholder="Enter first name"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="last_name">
                            Last Name
                        </label>

                        <input
                            type="text"
                            id="last_name"
                            name="last_name"
                            placeholder="Enter last name"
                            required
                        >
                    </div>

                </div>


                <div class="form-group">
                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="student@example.com"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="e.g. 0700000000"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="course">
                        Course
                    </label>

                    <select id="course" name="course" required>

                        <option value="">
                            -- Select Course --
                        </option>

                        {% for course in courses %}

                            <option value="{{ course.id }}">
                                {{ course.course_code }} -
                                {{ course.course_name }}
                            </option>

                        {% endfor %}

                    </select>
                </div>


                <button type="submit" class="register-btn">
                    Register Student
                </button>

            </form>


            <a href="/" class="back-link">
                ← Back to Home
            </a>

        </div>

    </main>


</body>
</html>
